<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tailscale Field Guide">
  <title>Tailscale Field Guide</title>
  <!-- Site mark: a three node mesh, the smallest possible tailnet.
       Colors mirror tokens.css by hand because an SVG file cannot read
       CSS custom properties; keep them in sync when the palette
       changes. -->
  <rect width="32" height="32" rx="6" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#21304a"/>
  <path d="M16 8 L9 22 L23 22 Z" fill="none" stroke="#45597a" stroke-width="1.5"/>
  <circle cx="16" cy="8" r="3.2" fill="#2dd4bf"/>
  <circle cx="9" cy="22" r="3.2" fill="#2dd4bf"/>
  <circle cx="23" cy="22" r="3.2" fill="#2dd4bf"/>
</svg>
