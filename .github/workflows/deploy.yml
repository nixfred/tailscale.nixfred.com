# Push to main deploys to Cloudflare Pages.
#
# Why Actions and not a Git-connected Pages project: connecting a repo to
# Pages natively requires an interactive GitHub OAuth grant in the
# Cloudflare dashboard, which cannot be performed from a CLI. This
# workflow produces the same behavior, a push to main ships the site,
# and it is fully configurable from the terminal.
#
# bootstrap.sh sets the CLOUDFLARE_API_TOKEN repository secret
# automatically. The token needs Account > Cloudflare Pages > Edit.
# The account id below is an identifier, not a secret.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once. Pages applies whichever upload finishes
# last, which is not necessarily the newest commit.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun astro build

      # The gates are the release contract. A red gate must never ship.
      # They run here against a FRESH CHECKOUT, which catches the class
      # of bug that passes locally because an untracked file happens to
      # exist in the working directory.
      - name: Link integrity gate
        run: ./tests/check-links.sh

      - name: Static safety gate
        run: ./tests/check-safety.sh

      - name: House style gate
        run: ./tests/check-copy.sh

      - name: Canonical URL gate
        run: ./tests/check-canonical.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b120e63874f8f8e9d75db4c1bf65a766
          command: pages deploy dist --project-name=tailscale-nixfred-com --branch=main
